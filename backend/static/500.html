<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="Une panne est survenue du côté de Lumenia.">
  <meta name="theme-color" content="#131019" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FAF5FF" media="(prefers-color-scheme: light)">
  <title>Panne de notre côté — Lumenia</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo-mark.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="gate">
    <div class="gate-card">
      <div class="brand-mark" aria-hidden="true">
        <img class="brand-img" src="/static/logo-mark.svg" alt="">
      </div>
      <p class="err-code" aria-hidden="true">500</p>
      <h1>Ça a cassé de notre côté</h1>
      <p class="gate-tagline">
        Tu n'y es pour rien et tu n'as rien perdu : ce qui était enregistré l'est
        toujours. Réessaie dans un instant.
      </p>
      <a class="btn-primary err-cta" href="/">Revenir au seuil</a>
      <p class="gate-footnote">
        En cas de détresse, le <a class="tel-urgence" href="tel:3114">3114</a> répond gratuitement, 24 h/24.
        Il ne dépend pas de Lumenia : il répond même quand nous sommes en panne.
      </p>
    </div>
  </main>
</body>
</html>
